# Coffee Loyalty — nginx reverse proxy
# Place at: /etc/nginx/sites-available/coffee.conf
# Symlink:  ln -s /etc/nginx/sites-available/coffee.conf /etc/nginx/sites-enabled/
# TLS: obtain via `certbot --nginx -d your.domain.tld` after first start.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.TLD;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.TLD;

    # certbot will fill these in automatically on first run:
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.TLD/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.TLD/privkey.pem;

    client_max_body_size 4m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # Block /admin/* from public internet by default — uncomment & restrict by IP if needed.
    # location /admin {
    #     allow 1.2.3.4;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     include /etc/nginx/proxy_params;
    # }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Cache static admin assets
    location /admin/static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_cache_valid  200 1h;
        expires            1h;
        add_header         Cache-Control "public";
    }
}
